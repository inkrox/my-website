<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流星雨</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
        .back {
            position: fixed; top: 16px; left: 16px; z-index: 50;
            padding: 8px 16px; font-size: 13px; letter-spacing: 1px;
            color: #eef2ff; text-decoration: none; cursor: pointer;
            background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .22);
            border-radius: 999px; backdrop-filter: blur(8px);
            transition: .25s;
        }
        .back:hover { border-color: #ffd166; box-shadow: 0 0 14px rgba(255, 209, 102, .5); }
        .hint {
            position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
            color: rgba(255, 255, 255, .5); font-size: 13px; letter-spacing: 3px;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            pointer-events: none; user-select: none; z-index: 2; text-align: center;
        }
    </style>
</head>
<body>
<a class="back" id="backBtn">← 返回主页</a>
<canvas id="sky"></canvas>
<div class="hint">点击夜空 · 许愿流星</div>
<script>
(function () {
    'use strict';

    var canvas = document.getElementById('sky');
    var ctx = canvas.getContext('2d');
    var width = 0;
    var height = 0;

    var STAR_COUNT = 220;   // 星星数量（用像素点绘制，数量适中）
    var METEOR_COUNT = 14;  // 流星数量
    var stars = [];
    var meteors = [];
    var sparks = [];        // 点击火花

    /* ---------- 返回主页（保留主页当前风格） ---------- */
    (function () {
        var back = document.getElementById('backBtn');
        var style = 'default';
        try { style = localStorage.getItem('bxr_style') || 'default'; } catch (e) {}
        back.href = '../index.html?style=' + style;
    })();

    /* ---------- 点击：流星 + 火花 ---------- */
    function burst(x, y) {
        for (var i = 0; i < 16; i++) {
            var a = Math.random() * Math.PI * 2;
            var sp = 1.5 + Math.random() * 4;
            sparks.push({
                x: x, y: y,
                vx: Math.cos(a) * sp,
                vy: Math.sin(a) * sp - 0.8,
                life: 1,
                size: Math.random() * 2 + 1
            });
        }
        for (var m = 0; m < 3; m++) {
            var mk = createMeteor();
            mk.x = x + (Math.random() - 0.5) * 180;
            mk.y = -20 - Math.random() * 100;
            mk.alpha = 1;
            meteors.push(mk);
        }
    }

    function drawSparks() {
        for (var i = sparks.length - 1; i >= 0; i--) {
            var s = sparks[i];
            s.x += s.vx;
            s.y += s.vy;
            s.vy += 0.08;          /* 微重力 */
            s.life -= 0.025;
            if (s.life <= 0) { sparks.splice(i, 1); continue; }
            ctx.globalAlpha = s.life;
            ctx.fillStyle = '#fff8e0';
            ctx.fillRect(s.x, s.y, s.size, s.size);
        }
        ctx.globalAlpha = 1;
    }

    /* ---------- 星星 ---------- */
    function createStar() {
        return {
            x: Math.random() * 100,
            y: Math.random() * 100,
            size: Math.random() * 1.4 + 0.4,
            twinkle: Math.random() * Math.PI * 2,
            speed: Math.random() * 0.08 + 0.03
        };
    }

    function drawStars() {
        for (var i = 0; i < stars.length; i++) {
            var star = stars[i];
            star.twinkle += star.speed;
            // 星星明暗闪烁（用百分比坐标，缩放窗口后自动适配）
            var px = star.x / 100 * width;
            var py = star.y / 100 * height;
            var alpha = 0.35 + 0.6 * (0.5 + 0.5 * Math.sin(star.twinkle));
            ctx.globalAlpha = alpha;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(px, py, star.size, star.size);
        }
        ctx.globalAlpha = 1;
    }

    /* ---------- 流星 ---------- */
    function createMeteor() {
        var angleRad = 30 * Math.PI / 180; // 倾斜角
        var length = Math.random() * 80 + 120;
        return {
            x: Math.random() * width,
            y: Math.random() * height * 0.6,
            length: length,
            offsetX: Math.cos(angleRad) * 6,
            offsetY: Math.sin(angleRad) * 6,
            width: length * Math.cos(angleRad),
            height: length * Math.sin(angleRad),
            alpha: 1
        };
    }

    function updateAndDrawMeteors() {
        for (var i = 0; i < meteors.length; i++) {
            var meteor = meteors[i];
            meteor.x -= meteor.offsetX;
            meteor.y += meteor.offsetY;
            meteor.alpha -= 0.006;

            if (meteor.alpha <= 0 || meteor.y > height + 100 || meteor.x < -200) {
                meteors[i] = createMeteor();
                continue;
            }

            var gradient = ctx.createLinearGradient(
                meteor.x, meteor.y,
                meteor.x + meteor.width, meteor.y - meteor.height
            );
            gradient.addColorStop(0, 'rgba(255,255,255,' + meteor.alpha + ')');
            gradient.addColorStop(0.4, 'rgba(220,225,255,' + meteor.alpha * 0.6 + ')');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');

            ctx.strokeStyle = gradient;
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(meteor.x, meteor.y);
            ctx.lineTo(meteor.x + meteor.width, meteor.y - meteor.height);
            ctx.stroke();
        }
    }

    /* ---------- 月亮（右上角，canvas 绘制） ---------- */
    function drawMoon() {
        var radius = 46;
        var x = width - radius - 40;
        var y = radius + 40;

        // 月晕
        var glow = ctx.createRadialGradient(x, y, radius * 0.3, x, y, radius * 2.4);
        glow.addColorStop(0, 'rgba(255, 250, 220, 0.30)');
        glow.addColorStop(1, 'rgba(255, 250, 220, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, y, radius * 2.4, 0, Math.PI * 2);
        ctx.fill();

        // 月面
        var moon = ctx.createRadialGradient(x - radius * 0.35, y - radius * 0.35, radius * 0.15, x, y, radius);
        moon.addColorStop(0, '#fffbe6');
        moon.addColorStop(1, '#e2d5a8');
        ctx.fillStyle = moon;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();

        // 环形山
        ctx.fillStyle = 'rgba(190, 175, 130, 0.55)';
        ctx.beginPath();
        ctx.arc(x - 12, y - 6, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x + 14, y + 12, 4, 0, Math.PI * 2);
        ctx.fill();
    }

    /* ---------- 主循环 ---------- */
    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }

    function frame() {
        // 半透明黑覆盖形成拖尾渐隐，不会擦掉月亮
        ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
        ctx.fillRect(0, 0, width, height);

        drawStars();
        updateAndDrawMeteors();
        drawSparks();
        drawMoon();
        requestAnimationFrame(frame);
    }

    function init() {
        resize();
        for (var i = 0; i < STAR_COUNT; i++) { stars.push(createStar()); }
        for (var j = 0; j < METEOR_COUNT; j++) { meteors.push(createMeteor()); }
        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, width, height);
        requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    canvas.addEventListener('click', function (e) {
        burst(e.clientX, e.clientY);
    });
    window.addEventListener('load', init);
})();
</script>
</body>
</html>
