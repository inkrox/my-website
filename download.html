<script>
  (function () {
    var SKINS = ['default', 'cyberpunk', 'terminal', 'classical', 'starry'];
    var skin = 'default';
    try {
      var m = location.search.match(/[?&]style=([\w-]+)/);
      if (m && SKINS.indexOf(m[1]) !== -1) { skin = m[1]; }
      else if (localStorage.getItem('bxr_style')) { skin = localStorage.getItem('bxr_style'); }
    } catch (e) {}
    if (SKINS.indexOf(skin) === -1) { skin = 'default'; }
    document.documentElement.className = 'skin-' + skin;
    for (var s = 0; s < SKINS.length; s++) {
      var pre = document.createElement('link');
      pre.rel = 'stylesheet';
      pre.href = 'skins/skin-' + SKINS[s] + '.css';
      document.head.appendChild(pre);
    }
  })();
</script>
<style>

    --accent2: #22d3ee;
    --accent3: #f472b6;
    --ink: #eef1ff;
    --ink-dim: #aab3d6;
    --card: rgba(255, 255, 255, 0.06);
    --card-border: rgba(255, 255, 255, 0.12);
    --bg-solid: #0f1023;
    --mono: "Cascadia Mono", Consolas, "JetBrains Mono", monospace;
    --kai: "STKaiti", "KaiTi", "楷体", serif;

  html.skin-terminal { --accent: #33ff66; --accent2: #ffcc33; --accent3: #ffcc33; --bg-solid: #050805; --ink: #33ff66; --ink-dim: #1f9e4a; --card: rgba(5, 10, 5, .92); --card-border: #1f9e4a; }
  html.skin-classical { --accent: #a63a2b; --accent2: #a8863d; --accent3: #b03a2e; --bg-solid: #f6f1e3; --ink: #33291f; --ink-dim: #6d5f4c; --card: rgba(255, 252, 242, .85); --card-border: rgba(51, 41, 31, .35); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* 所有规则用 #secView / #secBody 前缀，彻底隔离 skins/skin-*.css 的 .card 等干扰 */

    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink); background: var(--bg-solid);
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  .skin-view { display: none; width: 100%; }
  html.skin-default .skin-view[data-skin="default"] { display: block; }
  html.skin-cyberpunk .skin-view[data-skin="cyberpunk"] { display: block; }
  html.skin-terminal .skin-view[data-skin="terminal"] { display: block; }
  html.skin-classical .skin-view[data-skin="classical"] { display: block; }
  html.skin-starry .skin-view[data-skin="starry"] { display: block; }
  #secView .skin-switch {
    position: fixed; top: 14px; right: 14px; z-index: 99;
    display: flex; gap: 4px; padding: 6px 8px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 999px; backdrop-filter: blur(10px);
  }
  #secView .skin-switch button {
    font-size: 14px; line-height: 1; padding: 6px 9px; border-radius: 999px;
    border: 1px solid transparent; background: transparent; cursor: pointer; filter: grayscale(.4); opacity: .7;
    transition: .25s;
  }
  #secView .skin-switch button:hover { filter: none; opacity: 1; }
  #secView .skin-switch button.cur { border-color: var(--accent); opacity: 1; filter: none; box-shadow: 0 0 10px var(--accent); }
  #secView .dl-card {
    position: relative; width: min(430px, calc(100vw - 40px));
    margin: 0 auto;
    text-align: center; padding: 44px 36px 36px;
    background: var(--card); border: 1px solid var(--card-border);
    border-radius: 20px; backdrop-filter: blur(14px);
    box-shadow: 0 16px 48px rgba(0, 0, 0, .4);
  }
  #secView .lock { font-size: 48px; animation: lockFloat 3s ease-in-out infinite; }
  @keyframes lockFloat { 50% { transform: translateY(-6px); } }
  #secView h1 { margin-top: 14px; font-size: 24px; letter-spacing: 3px; font-weight: 800; }
  #secView .sub { margin-top: 8px; font-size: 13.5px; color: var(--ink-dim); line-height: 1.8; letter-spacing: .5px; }
  #secView .pick-row { margin-top: 18px; position: relative; }

    font-family: inherit; color: var(--ink); cursor: pointer;
    background-color: rgba(255, 255, 255, .10);
    border: 1px solid rgba(255, 255, 255, .22); border-radius: 12px; outline: none;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    transition: border-color .25s, box-shadow .25s;
  }
  #secView .pick-btn:hover { border-color: var(--accent); }
  #secView .pick-btn:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 108, 255, .18), 0 0 14px rgba(124, 108, 255, .35); }
  #secView .pick-arrow {
    width: 0; height: 0; flex: none;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-top: 6px solid var(--accent);
    transition: transform .25s;
  }
  #secView .pick-row.open .pick-arrow { transform: rotate(180deg); }
  #secView .pick-list {
    position: absolute; top: calc(100% + 8px); left: 0; right: 0; z-index: 50;
    background: rgba(10, 12, 30, .97); border: 1px solid rgba(255, 255, 255, .22);
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 12px 36px rgba(0, 0, 0, .45);
    display: none;
  }
  #secView .pick-row.open .pick-list { display: block; animation: pickIn .18s ease; }
  @keyframes pickIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  #secView .pick-opt {
    display: block; width: 100%; padding: 12px 16px; font-size: 14.5px; text-align: left;
    font-family: inherit; color: var(--ink); background: transparent;
    border: none; cursor: pointer; transition: background .15s;
  }
  #secView .pick-opt:hover { background: rgba(255, 255, 255, .12); }
  #secView .pick-opt.cur { color: var(--accent); font-weight: 700; background: rgba(255, 255, 255, .06); }
  #secView .pw-row { margin-top: 24px; position: relative; }
  #secView #pw {
    width: 100%; padding: 14px 46px 14px 18px; font-size: 15px;
    font-family: inherit; letter-spacing: 2px;
    color: var(--ink); background: rgba(255, 255, 255, .07);
    border: 1px solid var(--card-border); border-radius: 12px; outline: none;
    transition: .25s;
  }
  #secView #pw:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 108, 255, .18), 0 0 14px rgba(124, 108, 255, .35); }
  #secView #pw::placeholder { letter-spacing: 0; color: var(--ink-dim); opacity: .6; }
  #secView .eye {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 34px; height: 34px; border: none; background: transparent;
    font-size: 16px; cursor: pointer; opacity: .65; transition: .2s;
  }
  #secView .eye:hover { opacity: 1; }
  #secView #go {
    width: 100%; margin-top: 16px; padding: 14px 0; font-size: 16px;
    font-weight: 700; letter-spacing: 4px; cursor: pointer;
    color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 12px; transition: .25s;
    font-family: inherit;
  }
  #secView #go:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(0, 0, 0, .35), 0 0 18px var(--accent); }
  #secView #go:disabled { opacity: .55; cursor: wait; transform: none; box-shadow: none; }
  #secView #status { margin-top: 14px; min-height: 22px; font-size: 13.5px; color: var(--ink-dim); letter-spacing: .5px; }
  #secView #status.ok { color: #4ade80; }
  #secView #status.err { color: #f87171; }
  #secView .hint { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--card-border); font-size: 11.5px; color: var(--ink-dim); opacity: .75; line-height: 1.9; }
  #secView .back { display: inline-block; margin-top: 16px; font-size: 13px; color: var(--accent2); text-decoration: none; letter-spacing: 1px; transition: .2s; }
  #secView .back:hover { text-shadow: 0 0 10px var(--accent2); }
  /* 皮肤微调 */

  /* 极光 / 星空：深色底 + 亮边框 */

</style>
